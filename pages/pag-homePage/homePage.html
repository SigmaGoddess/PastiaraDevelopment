<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="/normalize.css">
    <link rel="stylesheet" href="/css/global_variables.css">
    <link rel="stylesheet" href="/css/homePage.css">

</head>

<body>
    <main>
        <div class="container-fluid">
            <div class="row align-items-center"> <!-- row es fila, horizontal-->
                <!-- Colmunas con el mismo ancho: distribución equitativa -->
                <div class="col text-center">
                    <h1>
                        ¡Bienvenidos a Pastiara, una experiencia al paladar!</h1>
                    <div class="contenedor-fondo align-items-center">
                        <p class="subtitle">Los elaboramos diariamente a mano, con
                            ingredientes de la más alta calidad para que disfrutes de un sabor auténtico y fresco,
                            directo de nuestro horno a tu mesa.</p>
                    </div>
                    <button class="btn" type="button">¡Cotiza aquí!</button>
                </div>
                <div class="col">
                    <img src="/images/INICIO/PASTES HOME PAGE.jpg" alt="Pastes de home page" class="img1">
                </div>
            </div>
        </div>
        <div class="container-fluid justify-content-center">
            <div class="row align-items-center">
                <div class="col">
                    <img src="/images/GENERAL/Iconos-paste-derecha.png" alt="Pastes de Iconos-paste-derecha"
                        class="img2">
                </div>
                <div class="col">
                    <img src="/images/GENERAL/Iconos-pastes-sola.png" alt="Pastes de Iconos-pastes-sola" class="img2">
                </div>
                <div class="col">
                    <img src="/images/GENERAL/Iconos-paste-izquiera.png" alt="Pastes de Iconos-paste-izquiera"
                        class="img2">
                </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="/js/homePage.js"></script>
</body>

</html>
