<head>

  <link rel="icon" type="image/webp" href="https://i.ibb.co/fYNTDwJd/favicon-pastiara.webp">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  
  <!-- Estilos propios -->

  <link rel="stylesheet" href="/css/navbar.css">

<body>
  <special-loader></special-loader>
  <special-header></special-header>

  <main class="body-regalar">
    <!-- Header principal -->
    <header class="pastiara-header">
      <h1 class="pastiara-main-title">Con amor y sabor...</h1>
      <p class="pastiara-subtitle">La forma más elegante de compartir sabor y calidez en un solo bocado.</p>
    </header>

    <!-- Sección: Para regalar -->
    <section class="container">
      <h2 class="pastiara-section-title">Para regalar</h2>
    </section>

    <!-- Contenedor donde JavaScript cargará los 3 productos dinámicamente -->
    <div id="productos-container">
      <!-- Los 3 productos (Capricho pastiara, Viaje de sabores, Dulce magia) 
           se cargarán aquí desde la API de categoría 4 -->
    </div>

  </main>

  <button class="btn-flotante-ordenar" type="button" onclick="location.href='/pages/pag-cotizador/cotizador.html'">
    <span class="btn-text">¡ORDENA AQUÍ!</span>
    <img src="/public/images/GENERAL/CanastaConPastesCafe.png" alt="Ícono de Carrito" class="icono-boton">
    <span class="btn-icon" aria-hidden="true"></span>
  </button>

  <special-footer></special-footer>
