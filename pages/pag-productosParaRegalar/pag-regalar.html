<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Con amor y sabor - Para regalar</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Questrial&display=swap" rel="stylesheet">
    
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="pag-regalar.css">
</head>
<body>
    <!-- Patrones decorativos de tacos -->
    <div class="regalar-taco-pattern" style="left: 5%; top: 15%;">
        <svg viewBox="0 0 100 100">
            <path d="M10,80 Q50,20 90,80 L10,80 Z" />
            <line x1="30" y1="80" x2="25" y2="60" />
            <line x1="50" y1="80" x2="50" y2="50" />
            <line x1="70" y1="80" x2="75" y2="60" />
        </svg>
    </div>
    
    <div class="regalar-taco-pattern" style="right: 8%; top: 35%;">
        <svg viewBox="0 0 100 100">
            <path d="M10,80 Q50,20 90,80 L10,80 Z" />
            <line x1="30" y1="80" x2="25" y2="60" />
            <line x1="50" y1="80" x2="50" y2="50" />
            <line x1="70" y1="80" x2="75" y2="60" />
        </svg>
    </div>
    
    <div class="regalar-taco-pattern" style="left: 10%; bottom: 25%;">
        <svg viewBox="0 0 100 100">
            <path d="M10,80 Q50,20 90,80 L10,80 Z" />
            <line x1="30" y1="80" x2="25" y2="60" />
            <line x1="50" y1="80" x2="50" y2="50" />
            <line x1="70" y1="80" x2="75" y2="60" />
        </svg>
    </div>
    
    <div class="regalar-taco-pattern" style="right: 5%; bottom: 15%;">
        <svg viewBox="0 0 100 100">
            <path d="M10,80 Q50,20 90,80 L10,80 Z" />
            <line x1="30" y1="80" x2="25" y2="60" />
            <line x1="50" y1="80" x2="50" y2="50" />
            <line x1="70" y1="80" x2="75" y2="60" />
        </svg>
    </div>

    <!-- Líneas decorativas -->
    <div class="regalar-decorative-line regalar-line-top"></div>
    <div class="regalar-decorative-line regalar-line-middle"></div>

    <!-- Header -->
    <div class="regalar-header-section">
        <h1 class="regalar-main-title">Con amor y sabor.....</h1>
        <p class="regalar-subtitle">La forma más elegante de compartir sabor y calidez en un solo bocado.</p>
    </div>

    <!-- Contenido Principal -->
    <div class="container">
        <!-- Sección: Para regalar -->
        <h2 class="regalar-section-title">Para regalar</h2>
        
        <div class="row justify-content-center">
            <!-- Producto 1: Barquillos de budín -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="regalar-product-card">
                    <img src="barquillos-budin.jpg" alt="Barquillos de budín" class="regalar-product-image">
                    <button class="regalar-favorite-btn" data-product="1">
                        <svg viewBox="0 0 24 24">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                    </button>
                    <div class="regalar-product-info">
                        <p class="regalar-product-name">Caja de 6 Barquillos rellenos de Budín Pastiara</p>
                        <p class="regalar-product-price">(Edición) $230</p>
                    </div>
                </div>
            </div>

            <!-- Producto 2: Volvovanes -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="regalar-product-card">
                    <img src="volvovan-brigadeiro.jpg" alt="Volvovanes de brigadeiro" class="regalar-product-image">
                    <button class="regalar-favorite-btn" data-product="2">
                        <svg viewBox="0 0 24 24">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                    </button>
                    <div class="regalar-product-info">
                        <p class="regalar-product-name">Volvovanes de brigadeiro</p>
                        <p class="regalar-product-price">(Chicas) + 4 Roles de guayaba $ 300</p>
                    </div>
                </div>
            </div>

            <!-- Producto 3: Cajas de regalo -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="regalar-product-card">
                    <img src="cajas-regalo.jpg" alt="Cajas de regalo Pastiara" class="regalar-product-image">
                    <button class="regalar-favorite-btn" data-product="3">
                        <svg viewBox="0 0 24 24">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                    </button>
                    <div class="regalar-product-info">
                        <p class="regalar-product-name">Cajas de regalo Pastiara</p>
                        <p class="regalar-product-price">Precio según selección</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <!-- JavaScript personalizado -->
    <script src="pag-regalar.js"></script>
</body>
</html>
