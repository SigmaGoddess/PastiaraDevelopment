<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil de Usuario</title>

    <!-- Favicon-->
    <link rel="icon" type="image/png" href="/public/images/GENERAL/favicon-pastiara.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!--Icons de footer-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="/css/normalize.css">
    <link rel="stylesheet" href="/css/global_variables.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/footer.css">

    <link rel="stylesheet" href="/css/volovanes.css">

    <link rel="stylesheet" href="/css/perfil_usuario.css">
</head>

<body>
    <special-header></special-header>

    <div class="account-container">
        <aside class="account-sidebar">
            <h2 class="sidebar-title">Mi cuenta</h2>
            <nav class="sidebar-nav">
                <ul class="sidebar-menu">
                    <li><a href="#" class="active" data-tab="personales">Datos personales</a></li>
                    <li><a href="#" data-tab="cotizaciones">Cotizaciones</a></li>
                    <li><a href="#" data-tab="favoritos">Favoritos</a></li>
                </ul>
            </nav>
        </aside>

        <main class="account-content">

            <section id="personales" class="tab-content active">
                <div class="title-group">
                    <h1 class="content-title">Datos personales</h1>
                    <div class="title-underline"></div>
                </div>
                <div class="personal-data-grid" id="datos-personales-container">
                    <div class="data-item">
                        <span class="data-label">Nombre:</span>
                        <span class="data-value" data-key="nombre"></span>
                        <input type="text" class="edit-input" id="input-nombre" value="" maxlength="20">
                    </div>
                    <div class="data-item">
                        <span class="data-label">Teléfono:</span>
                        <span class="data-value" data-key="telefono"></span>
                        <input type="tel" class="edit-input" id="input-telefono" value="">
                    </div>
                    <div class="data-item">
                        <span class="data-label">Correo electrónico:</span>
                        <span class="data-value" data-key="correo"></span>
                        <input type="email" class="edit-input" id="input-correo" value="" maxlength="45">
                    </div>
                </div>
                <div class="button-container">
                    <button id="btn-editar" class="btn-primary">Editar</button>
                </div>
            </section>

            <section id="cotizaciones" class="tab-content">
                <div class="title-group">
                    <h1 class="content-title">Mis Cotizaciones</h1>
                    <div class="title-underline"></div>
                </div>

                <div id="contenedor-cotizaciones">
                    <p style="text-align: center; color: #888;"></p>
                </div>
            </section>

            <section id="favoritos" class="tab-content">
                <div class="title-group">
                    <h1 class="content-title">Mis Favoritos</h1>
                    <div class="title-underline"></div>
                </div>
                <div class="row" id="favoritos-grid">
                </div>
            </section>

        </main>
    </div>

    <special-footer></special-footer>

    <div id="edit-profile-modal" class="auth-modal-overlay" style="display:none;">
        <div class="auth-modal-content">
            <h3>Editar datos personales</h3>
            <div class="edit-fields">
                <label>Nombre
                    <input id="edit-nombre" type="text" maxlength="50">
                </label>
                <label>Teléfono
                    <input id="edit-telefono" type="tel" maxlength="10">
                </label>
                <label>Correo
                    <input id="edit-correo" type="email" maxlength="80">
                </label>
            </div>
            <div class="auth-modal-buttons">
                <button id="edit-save" class="btn-primary">Guardar</button>
                <button id="edit-cancel" class="btn-secondary">Cancelar</button>
            </div>
            <button id="edit-modal-close" class="auth-modal-close-btn">&times;</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <script src="/js/main.js" type="module"></script>
    <script src="/js/components.js" type="module"></script>
    <script src="/js/perfil_usuario.js" type="module"></script>
</body>

</html>
