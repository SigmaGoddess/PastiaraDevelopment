<body class="bg-gray-100">

        <div class="block md:flex max-w-7xl mx-auto p-4 md:p-0">

            <div class="w-full md:w-3/4 p-0 md:p-8">

                    <div id="datos-personales-container" class="text-base md:text-xl text-gray-600 space-y-4 max-w-lg mx-auto">
                        <p class="flex flex-col sm:flex-row justify-between items-start sm:items-center"><strong>Nombre:</strong> <span data-key="nombre">Rodo</span></p>
                        <p class="flex flex-col sm:flex-row justify-between items-start sm:items-center"><strong>Fecha de nacimiento:</strong> <span data-key="fecha">25/07/2002</span></p>
                        <p class="flex flex-col sm:flex-row justify-between items-start sm:items-center"><strong>Teléfono:</strong> <span data-key="telefono">5568999999</span></p>
                        <p class="flex flex-col sm:flex-row justify-between items-start sm:items-center"><strong>Correo electrónico:</strong> <span data-key="correo">shei_pastiara@gmail.com</span></p>
                    </div>
                    <div class="flex flex-col sm:flex-row justify-center items-center gap-4 mt-8">
                        <button id="btn-editar" class="btn-primary bg-[#916e55] hover:bg-[#7a5c46] w-full sm:w-auto h-12 px-6 rounded-lg text-white font-semibold text-lg flex items-center justify-center gap-2 transition-colors">

                            <svg class="size-6" fill="white" viewBox="0 0 20 20"><path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z"></path><path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd"></path></svg>

                            Cotiza aquí

                            <div class="absolute top-3 right-3 bg-black/30 rounded-full p-1">
                                <svg class="heart-icon size-6" viewBox="0 0 24 24">
                                    <path fill="white" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
