<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>

    <!-- Favicon-->
    <link rel="icon" type="image/png" href="/favicon-pastiara.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="/css/loader.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/Footer.css">
    <link rel="stylesheet" href="/css/perfil_usuario.css">
</head>

<body class="bg-gray-100">

    <special-loader></special-loader>
    <special-header></special-header>

    <nav class="tabs-container bg-white shadow-sm">
        <div class="max-w-7xl mx-auto flex">
            <a href="#datos-personales-section" class="tab-link">Datos personales</a>
            <a href="#cotizaciones-section" class="tab-link">Cotizaciones</a>
            <a href="#favoritos-section" class="tab-link">Favoritos</a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-8">
        <section id="datos-personales-section" class="user-section">
            <h2 class="font-abril text-[#b58a6a] text-4xl md:text-5xl text-center mb-8">Datos personales</h2>
            <div id="datos-personales-container" class="text-base md:text-xl text-gray-600 space-y-4 max-w-lg mx-auto">
                <p><strong>Nombre:</strong> <span data-key="nombre">Rodo</span></p>
                <p><strong>Fecha de nacimiento:</strong> <span data-key="fecha">25/07/2002</span></p>
                <p><strong>Teléfono:</strong> <span data-key="telefono">5568999999</span></p>
                <p><strong>Correo electrónico:</strong> <span data-key="correo">shei_pastiara@gmail.com</span></p>
            </div>
            <div class="flex flex-col sm:flex-row justify-center items-center gap-4 mt-8">
                <button id="btn-editar" class="btn-primary">
                    <span id="btn-editar-texto">Editar</span>
                </button>
                <button id="btn-cotizar" class="btn-secondary">Cotiza aquí</button>
            </div>
            <div class="text-center mt-12">
                <button class="btn-delete">Eliminar cuenta</button>
            </div>
        </section>

        <section id="cotizaciones-section" class="user-section">
            <h2 class="font-abril text-[#b58a6a] text-4xl md:text-5xl text-center mb-8">Cotizaciones</h2>
            <p class="text-xl text-gray-500 text-center">No cuentas con pedidos actualmente.</p>
        </section>

        <section id="favoritos-section" class="user-section">
            <h2 class="font-abril text-[#b58a6a] text-4xl md:text-5xl text-center mb-8">Favoritos</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
        </section>
    </main>

    <special-footer></special-footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="/js/perfil_usuario.js" type="module"></script>
    <script src="/js/components.js" type="module"></script>
    <script src="/js/main.js" type="module"></script>
</body>

</html>
