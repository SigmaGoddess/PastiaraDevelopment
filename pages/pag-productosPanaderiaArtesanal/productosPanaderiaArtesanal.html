<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastiara - Panadería artesanal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    
    <link rel="stylesheet" href="/css/global_variables.css">
    <link rel="stylesheet" href="/css/normalize.css">
    <link rel="stylesheet" href="/css/loader.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/panaderia.css">
</head>

<body class="container-panaderia">
    
    <header>
        <special-loader></special-loader>
        <special-header></special-header>
    </header>

    <section id="inicio" class="hero-section">
        <div class="container">
            <h1 class="hero-title">Conoce nuestra panadería artesanal</h1>
        </div>
    </section>

    <section id="productos" class="products-section">
        <div class="container-fluid">
            <div class="row justify-content-center gx-5">

                <div class="col-lg-4 col-md-6 mb-5">
                    <div class="product-card">
                        <div class="product-image-container">
                            <img src="/images/PANADERÍA-ARTESANAL/barquillo_panaderia (1).png" alt="barquillo budin" class="product-image">
                            <button class="heart-favorite" data-product="barquillo-budin" onclick="toggleFavorite('barquillo-budin')" aria-label="Marcar como favorito">
                                <i class="fas fa-heart"></i>
                            </button>
                        </div>
                        <div class="product-info">
                            <h3>Barquillo relleno de budín pastiara</h3>
                            <p class="price">$35</p>
                            <p class="description">(Masa de hojaldre, budín de naranja)</p>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4 col-md-6 mb-5">
                    <div class="product-card">
                        <div class="product-image-container">
                            <img src="/images/PANADERÍA-ARTESANAL/rollo_panaderia.png" alt="Rollito guayaba" class="product-image">
                            <button class="heart-favorite" data-product="rollo-guayaba" onclick="toggleFavorite('rollo-guayaba')" aria-label="Marcar como favorito">
                                <i class="fas fa-heart"></i>
                            </button>
                        </div>
                        <div class="product-info">
                            <h3>Rollito de guayaba</h3>
                            <p class="price">$35</p>
                            <p class="description">(Masa de hojaldre, mermelada de guayaba natural)</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>

   <button class="btn cotizador" type="button"
        onclick="location.href='/pages/pag-cotizador/cotizador.html'">
        <span class="btn-text">¡ORDENA AQUÍ!</span>
        <img src="/public/images/GENERAL/CanastaConPastes.png" alt="Ícono de Carrito" class="icono-boton">
        <span class="btn-icon" aria-hidden="true"></span>
    </button>


    <special-footer></special-footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="/js/panaderia.js" type="module"></script>
    <script src="/js/components.js" type="module"></script>
    <script src="/js/main.js" type="module"></script>

</body>
</html>
