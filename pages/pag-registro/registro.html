<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>

    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!--Fuentes-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Questrial&display=swap" rel="stylesheet">

    <!--Estilos-->
    <link rel="stylesheet" href="../../css/registro.css">

</head>

<body>
<!--<special-header></special-header> -->

    <div class="container-fluid">
        <div class="row min-vh-100 d-flex align-items-center">
            <div class="cinta-decorativa"></div>
            <div class="col-10 col-sm-10 col-md-9 col-lg-8" >

                <div class="login-card">

                    <div class="row">
                        <div class="col-12 col-sm-12 col-md-9">
                            <h1 class="text-start">Iniciar sesión</h1>
                        </div>
                        <div class="col-sm-12 col-md-3 text-center">
                            <img src="../../images/REGISTRO/IconoDeInicioSesion.png" alt="Icono de paste con simbolo de usuario">
                        </div>
                    </div>

                    <form>
                        <div class="mb-4">
                            <label for="email" class="form-label">Correo electrónico:</label>
                            <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com">
                        </div>

                        <div class="mb-1">
                            <label for="password" class="form-label">Contraseña:</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="password" placeholder="********">
                                <span class="input-group-text">
                                    <i class="bi bi-eye-slash" id="togglePassword"></i>
                                </span>
                            </div>
                        </div>

                        <div class="mb-1 text-start">
                            <a href="#" class="forgot-password-link">Olvidé mi contraseña</a>
                        </div>

                        <div class="mt-4 text-center">
                            <button type="submit" class="btn btn-login">Iniciar sesión</button>
                        </div>

                        <div class="mt-3 text-center">
                            <p class="register-link">¿Aún no tienes cuenta? | <a href="#">Regístrate</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/registro.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/main.js"></script>
</body>

</html>
