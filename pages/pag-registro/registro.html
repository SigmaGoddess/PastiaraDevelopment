<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>

    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!--Fuentes-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Questrial&display=swap" rel="stylesheet">

    <!--Estilos-->
    <link rel="stylesheet" href="/css/registro.css">
    <link rel="stylesheet" href="/css/registro.css">

</head>

<body>

    <div class="container-fluid">
        <div class="row min-vh-100 d-flex align-items-center">
            <div class="cinta-decorativa"></div>
            <div class="col-10 col-sm-10 col-md-7 col-lg-6">

                <!----------------------------Formulario inicio de sesión----------------------------------------->
                <form id="login-form">
                    <div class="login-card">
                        <div class="row">
                            <div class="col-12 col-sm-12 col-md-9 col-lg-8">
                                <h1 class="text-start">Iniciar sesión</h1>
                            </div>
                            <div class="text-center col-sm-12 col-md-3 col-lg-4">
                                <img src="/images/REGISTRO/IconoDeInicioSesion.png"
                                    alt="Icono de paste con simbolo de usuario">
                            </div>
                        </div>

                        <div>
                            <label for="login-email" class="form-label">Correo electrónico:</label>
                            <input type="email" class="form-control" id="login-email" placeholder="ejemplo@correo.com">
                        </div>

                        <div class="mt-4">
                            <label for="login-password" class="form-label">Contraseña:</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="login-password" placeholder="********">
                                <span class="input-group-text">
                                    <i class="bi bi-eye-slash  password-toggle-icon" id="toggleLoginPassword"></i>
                                </span>
                            </div>
                        </div>

                        <div class="text-start">
                            <p><a href="#" class="forgot-password-link">Olvidé mi contraseña</a></p>
                        </div>

                        <div class="mt-5 text-center">
                            <button type="submit" class="btn btn-login">Iniciar sesión</button>
                        </div>

                        <div class="mt-3 text-center">
                            <p>¿Aún no tienes cuenta? | <a href="#" id="show-sign-up-link">Regístrate</a></p>
                        </div>

                    </div>
                </form>

                <!----------------------------Formulario de registro-------------------------------------------->    
                <form id="register-form" class="d-none">
                    <div class="sign-up-card">
                        
                        <div class="row"> 
                            <h1>Crear cuenta</h1>

                            <div class="col-12 col-md-6">
                                <label for="name" class="form-label">Nombre:</label>
                                <input type="text" class="form-control" id="name" placeholder="Nombre(s):">
                            </div>
                                                                      
                            <div class="col-12 col-md-6  mt-4 mt-md-0">
                                <label for="last-name" class="form-label">Primer apellido:</label>
                                <input type="text" class="form-control" id="last-name" placeholder="Primer apellido:">
                            </div>                            
                        </div>

                        <div class="row mt-4"> 
                            <div class="col-12 col-md-6">
                                <label for="sign-up-email" class="form-label">Correo electrónico:</label>
                                <input type="email" class="form-control" id="sign-up-email" placeholder="ejemplo@correo.com">
                            </div>

                            <div class="col-12 col-md-6 mt-4 mt-md-0">
                                <label for="phone-number" class="form-label">Teléfono:</label>
                                <input type="tel" class="form-control" id="phone-number" placeholder="Ingresa teléfono a 10 dígitos">
                            </div>
                        </div>

                        <div class="row mt-4"> 
                            <div class="col-12 col-md-6">
                                <label for="sign-up-password" class="form-label">*Ingresa contraseña:</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="sign-up-password" placeholder="********">
                                    <span class="input-group-text">
                                        <i class="bi bi-eye-slash  password-toggle-icon" id="toggleSignUpPassword"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="col-12 col-md-6 mt-4 mt-md-0">
                                <label for="confirm-password" class="form-label">Confirma contraseña:</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="confirm-password" placeholder="********">
                                    <span class="input-group-text">
                                        <i class="bi bi-eye-slash  password-toggle-icon" id="toggleConfirmPassword"></i>
                                    </span>
                                </div>
                            </div>

                            <div>
                                <p>*Debe incluir 8 caracteres (mayúsculas, minúsculas, un número, un símbolo)</p>
                            </div>

                            <div class="mt-3 text-center">
                                <button type="submit" class="btn btn-sign-up">Crear cuenta</button>
                            </div>
                            
                            <div class="mt-3 text-center">
                                <p>¿Ya tienes cuenta? | <a href="#"id="show-login-link">Iniciar sesión</a></p>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/registro.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/main.js"></script>
</body>

</html>
